<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventSphere — Instant Manual Ticketing & Global Discovery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' }
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        }
                    },
                    animation: {
                        shimmer: 'shimmer 1.5s infinite'
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between text-slate-900 antialiased" x-data="eventApp()" x-init="init()">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" @click="resetAllFilters()">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-600/30">
                    E
                </div>
                <div>
                    <span class="text-lg font-extrabold tracking-tight text-slate-900">EventSphere</span>
                    <span class="block text-[9px] uppercase font-bold tracking-widest text-brand-600">Google Connected</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <!-- Secret Admin Toggle Button -->
                <button @click="toggleAdminMode()" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-brand-50 hover:text-brand-600 transition" x-text="isAdmin ? '👑 Admin Active' : '⚙ Admin Login'"></button>
                
                <span class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-sm transition-all">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-ping"></span>
                    <span x-text="loading ? 'Syncing Live Sheet...' : 'Live Sync Active'"></span>
                </span>
            </div>
        </div>
    </header>

    <!-- DIRECT LINK PURCHASE BANNER -->
    <template x-if="directEventMode && activeEvent">
        <section class="bg-indigo-900 text-white py-10 px-4 sm:px-6 lg:px-8 border-b border-indigo-950 shadow-inner">
            <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6">
                <div class="space-y-2 text-center sm:text-left">
                    <span class="bg-brand-600 text-white px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider">🎫 Express Checkout Mode</span>
                    <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight" x-text="'Securing Ticket for: ' + activeEvent.title"></h2>
                    <p class="text-xs sm:text-sm text-indigo-200" x-text="activeEvent.date + ' • ' + activeEvent.location + ' | Organizer: ' + activeEvent.organizer"></p>
                </div>
                <button @click="resetAllFilters()" class="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-semibold transition border border-white/20 whitespace-nowrap">
                    Browse All Events 🌍
                </button>
            </div>
        </section>
    </template>

    <!-- HERO & DYNAMIC GLOBAL FILTER ENGINE -->
    <template x-if="!directEventMode">
        <section class="relative bg-gradient-to-b from-white via-slate-50 to-slate-100 py-12 px-4 sm:px-6 lg:px-8 border-b border-slate-200">
            <div class="max-w-4xl mx-auto text-center space-y-6">
                <h1 class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight">
                    Secure your tickets worldwide, <span class="text-brand-600">zero gateway fees.</span>
                </h1>
                <p class="text-sm sm:text-base text-slate-600 max-w-2xl mx-auto">
                    Discover live events across any country or continent, pay directly via mobile money or bank transfer, and receive your verified ticket instantly.
                </p>

                <!-- SEARCH BAR -->
                <div class="relative max-w-2xl mx-auto shadow-2xl shadow-slate-300/60 rounded-2xl overflow-hidden bg-white border border-slate-200">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                    <input 
                        type="text" 
                        x-model.debounce.30ms="searchQuery" 
                        placeholder="Search events by title, country, city, topic, or organizer..." 
                        class="w-full pl-12 pr-12 py-4 text-slate-900 placeholder-slate-400 bg-transparent text-sm sm:text-base focus:outline-none"
                    >
                    <template x-if="searchQuery">
                        <button @click="searchQuery = ''" class="absolute inset-y-0 right-0 pr-4 flex items-center text-xs font-bold text-slate-400 hover:text-slate-600">Clear</button>
                    </template>
                </div>

                <!-- DYNAMIC FILTER CONTROLS -->
                <div class="space-y-3 pt-2">
                    <!-- Region Filter -->
                    <div class="flex items-center justify-center flex-wrap gap-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-1">Region / Country:</span>
                        <template x-if="loading && availableRegions.length === 0">
                            <div class="flex space-x-2">
                                <div class="h-7 w-20 bg-slate-200 rounded-full animate-pulse"></div>
                                <div class="h-7 w-24 bg-slate-200 rounded-full animate-pulse"></div>
                                <div class="h-7 w-16 bg-slate-200 rounded-full animate-pulse"></div>
                            </div>
                        </template>
                        <template x-for="reg in availableRegions" :key="reg">
                            <button 
                                @click="selectedRegion = (selectedRegion === reg ? '' : reg)"
                                :class="selectedRegion === reg ? 'bg-indigo-900 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'"
                                class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-all capitalize"
                                x-text="reg"
                            ></button>
                        </template>
                    </div>

                    <!-- Category Filter -->
                    <div class="flex items-center justify-center flex-wrap gap-2">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-1">Category:</span>
                        <template x-for="cat in categories" :key="cat">
                            <button 
                                @click="selectedCategory = (selectedCategory === cat ? '' : cat)"
                                :class="selectedCategory === cat ? 'bg-brand-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'"
                                class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-all"
                                x-text="cat"
                            ></button>
                        </template>
                    </div>

                    <!-- Active Filter Reset Bar -->
                    <template x-if="searchQuery || selectedCategory || selectedRegion">
                        <div class="pt-2 flex items-center justify-center space-x-2 animate-fade-in">
                            <span class="text-xs text-slate-500 font-medium">Filters active.</span>
                            <button @click="resetAllFilters()" class="text-xs font-bold text-brand-600 hover:underline bg-brand-50 px-3 py-1 rounded-full border border-brand-100">Reset All Filters ✕</button>
                        </div>
                    </template>
                </div>
            </div>
        </section>
    </template>

    <!-- CATALOG GRID -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10" x-show="!directEventMode">
        <div class="flex items-center justify-between mb-6">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider" x-text="loading ? 'Syncing events from Google Sheet...' : 'Showing ' + filteredEvents.length.toLocaleString() + ' Events'"></p>
        </div>

        <!-- SKELETON LOADING GRID -->
        <template x-if="loading && events.length === 0">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <template x-for="i in [1, 2, 3, 4, 5, 6]">
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex flex-col space-y-4 p-4 animate-pulse">
                        <div class="h-48 w-full bg-slate-200 rounded-xl"></div>
                        <div class="space-y-3 flex-grow">
                            <div class="flex justify-between">
                                <div class="h-4 bg-slate-200 rounded w-1/3"></div>
                                <div class="h-4 bg-slate-200 rounded w-1/4"></div>
                            </div>
                            <div class="h-5 bg-slate-200 rounded w-4/5"></div>
                            <div class="h-3 bg-slate-200 rounded w-full"></div>
                            <div class="h-3 bg-slate-200 rounded w-2/3"></div>
                        </div>
                        <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
                            <div class="h-4 bg-slate-200 rounded w-1/3"></div>
                            <div class="h-6 bg-slate-200 rounded w-1/4"></div>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- EMPTY STATE -->
        <template x-if="!loading && filteredEvents.length === 0">
            <div class="text-center py-16 bg-white rounded-3xl border border-slate-200 p-8 space-y-4 max-w-md mx-auto shadow-sm">
                <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-400 text-xl font-bold">🌍</div>
                <div class="space-y-1">
                    <p class="text-base font-bold text-slate-800">No matching events found</p>
                    <p class="text-xs text-slate-500">Try adjusting your search or clearing your filters.</p>
                </div>
                <button @click="resetAllFilters()" class="px-5 py-2.5 rounded-xl bg-brand-600 text-white text-xs font-semibold hover:bg-brand-700 shadow-md">Clear Filters</button>
            </div>
        </template>

        <!-- EVENT CARDS GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" x-show="!loading || events.length > 0">
            <template x-for="event in filteredEvents" :key="event.id">
                <div 
                    @click="openEventModal(event)"
                    class="group bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col cursor-pointer transform hover:-translate-y-1 relative"
                >
                    <div class="relative h-48 w-full bg-slate-100 overflow-hidden">
                        <img :src="event.image" alt="Event" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-bold text-slate-900" x-text="event.category"></div>
                        <div class="absolute bottom-3 right-3 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-semibold text-white" x-text="getPrimaryPriceTag(event)"></div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between space-y-4">
                        <div class="space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-emerald-50 text-emerald-700 border border-emerald-200"
                                      x-text="getEventTiers(event).length + ' Ticket Tiers Available'">
                                </span>
                                <span class="text-[10px] text-slate-400 uppercase font-semibold" x-text="event.region"></span>
                            </div>

                            <div class="flex items-center space-x-1 text-xs font-semibold text-brand-600">
                                <span x-text="event.date"></span>
                                <span>•</span>
                                <span class="truncate max-w-[140px]" x-text="event.location"></span>
                            </div>
                            <h3 class="text-base font-bold text-slate-900 group-hover:text-brand-600 transition line-clamp-2" x-text="event.title"></h3>
                            <p class="text-slate-500 text-xs line-clamp-2" x-text="event.description"></p>
                        </div>
                        <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-semibold">
                            <span class="text-brand-600 group-hover:underline">Select Ticket Tier →</span>
                            <button @click.stop="copyEventLink(event.id, $event)" class="text-slate-400 hover:text-brand-600 text-[11px] flex items-center space-x-1 bg-slate-50 hover:bg-brand-50 px-2.5 py-1 rounded-lg border border-slate-200 transition">
                                <span>🔗 Copy Link</span>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- INLINE EXPRESS CHECKOUT CONTAINER -->
    <div class="flex-grow max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10" x-show="directEventMode && activeEvent">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden">
            <template x-if="activeEvent">
                <div>
                    <div class="relative h-64 w-full bg-slate-100">
                        <img :src="activeEvent.image" class="w-full h-full object-cover">
                    </div>
                    <div class="p-6 sm:p-10 space-y-6">
                        <div class="space-y-3">
                            <div class="flex items-center justify-between flex-wrap gap-2">
                                <span class="px-3.5 py-1 rounded-full text-xs font-bold bg-brand-50 text-brand-600" x-text="activeEvent.category"></span>
                                <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700" x-text="'Selected Tier: ' + selectedTier.name"></span>
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-2" x-text="activeEvent.title"></h2>
                            <p class="text-sm text-slate-500 mt-1" x-text="activeEvent.date + ' • ' + activeEvent.location"></p>
                            <p class="text-xs text-slate-600 mt-3 leading-relaxed" x-text="activeEvent.description"></p>
                        </div>

                        <!-- TICKET TIER SELECTOR CARDS -->
                        <div class="space-y-3">
                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-800">Select Your Ticket Tier:</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <template x-for="tier in getEventTiers(activeEvent.id)" :key="tier.name">
                                    <div @click="selectedTier = tier"
                                         :class="selectedTier.name === tier.name ? 'border-brand-600 bg-brand-50/60 ring-2 ring-brand-600' : 'border-slate-200 bg-white hover:border-slate-300'"
                                         class="p-4 rounded-2xl border cursor-pointer transition-all flex flex-col justify-between space-y-2">
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-bold text-slate-900" x-text="tier.name"></span>
                                            <span class="text-xs font-extrabold text-brand-600" x-text="tier.price"></span>
                                        </div>
                                        <div class="flex items-center justify-between text-[11px] text-slate-500">
                                            <span x-text="'🟢 ' + tier.remaining + ' left'"></span>
                                            <span x-text="selectedTier.name === tier.name ? '✓ Selected' : 'Select'"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- REVIEWS & ATTENDEE COMMENTS SECTION -->
                        <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200 space-y-4">
                            <div class="flex items-center justify-between">
                                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-800">💬 Verified Attendee Reviews</h4>
                                <span class="text-xs text-amber-500 font-bold">★ 4.9 / 5.0</span>
                            </div>

                            <div class="space-y-3">
                                <template x-for="review in getEventReviews(activeEvent.id)" :key="review.id">
                                    <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm space-y-1 relative">
                                        <div class="flex items-center justify-between text-xs">
                                            <span class="font-bold text-slate-800" x-text="review.author"></span>
                                            <div class="flex items-center space-x-2">
                                                <span class="text-[10px] text-slate-400" x-text="review.time"></span>
                                                <template x-if="isAdmin">
                                                    <button @click="deleteAdminReview(activeEvent.id, review.id)" class="text-[10px] text-red-500 hover:text-red-700 font-bold px-1.5 py-0.5 rounded bg-red-50">Delete</button>
                                                </template>
                                            </div>
                                        </div>
                                        <p class="text-xs text-slate-600" x-text="review.text"></p>
                                    </div>
                                </template>
                            </div>

                            <!-- Admin Comment & Tier Manager Box -->
                            <template x-if="isAdmin">
                                <div class="mt-4 pt-4 border-t border-slate-200 space-y-3 bg-brand-50 p-4 rounded-xl border border-brand-100">
                                    <span class="text-xs font-bold text-brand-900 block">👑 Admin Customizer: Add Tier or Review</span>
                                    
                                    <!-- Add Tier Sub-Form -->
                                    <div class="space-y-2 p-3 bg-white rounded-lg border border-brand-200">
                                        <span class="text-[11px] font-bold text-slate-700 block">➕ Add New Ticket Tier</span>
                                        <div class="grid grid-cols-3 gap-2">
                                            <input type="text" x-model="newTierName" placeholder="Tier Name (e.g., VVIP)" class="p-2 text-xs border rounded">
                                            <input type="text" x-model="newTierPrice" placeholder="Price (e.g., $150)" class="p-2 text-xs border rounded">
                                            <input type="number" x-model.number="newTierRemaining" placeholder="Qty Left" class="p-2 text-xs border rounded">
                                        </div>
                                        <button @click="addTicketTier(activeEvent.id)" class="w-full py-1.5 bg-brand-600 text-white text-xs font-bold rounded hover:bg-brand-700">Add Tier to Event</button>
                                    </div>

                                    <!-- Add Review Sub-Form -->
                                    <div class="space-y-2 pt-2">
                                        <input type="text" x-model="adminReviewerName" placeholder="Reviewer Name (e.g., Sarah M.)" class="w-full p-2.5 text-xs bg-white border border-slate-200 rounded-lg">
                                        <textarea x-model="newAdminComment" placeholder="Custom review comment..." class="w-full p-2.5 text-xs bg-white border border-slate-200 rounded-lg" rows="2"></textarea>
                                        <button @click="postAdminReview(activeEvent.id)" class="w-full py-2 bg-indigo-700 text-white text-xs font-bold rounded-lg hover:bg-indigo-800">Publish Custom Review →</button>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- STEP 1: PAYMENT INSTRUCTIONS -->
                        <div class="p-5 bg-indigo-50/75 rounded-2xl border border-indigo-100 space-y-3">
                            <div class="flex items-center justify-between">
                                <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-900" x-text="'Step 1: Send Payment for ' + selectedTier.name"></h4>
                                <span class="text-xs font-extrabold text-indigo-600 bg-white px-3 py-1 rounded-full shadow-sm" x-text="selectedTier.price"></span>
                            </div>
                            <p class="text-xs sm:text-sm text-slate-800 font-mono bg-white p-4 rounded-xl border border-indigo-100 shadow-inner" x-text="activeEvent.paymentInstructions + ' (Amount: ' + selectedTier.price + ')'"></p>
                        </div>

                        <!-- STEP 2: SUBMIT PROOF -->
                        <div class="p-6 bg-slate-50 rounded-2xl border border-slate-200 space-y-4">
                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-800">Step 2: Submit Ticket Delivery Info & Receipt</h4>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Your Email or WhatsApp Phone Number</label>
                                    <input type="text" x-model="buyerContact" placeholder="e.g., user@email.com or +254712345678" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-600">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Upload Payment Screenshot / Receipt</label>
                                    <input type="file" @change="handleFileUpload($event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:bg-brand-600 file:text-white cursor-pointer">
                                </div>
                            </div>
                        </div>

                        <div class="pt-4 flex items-center justify-between">
                            <button @click="resetAllFilters()" class="px-5 py-3 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-100">← Browse Other Events</button>
                            <button @click="submitOrder()" :disabled="submitting" class="px-8 py-3 rounded-xl bg-brand-600 text-white text-xs font-bold hover:bg-brand-700 shadow-lg disabled:opacity-50" x-text="submitting ? 'Submitting Proof...' : 'Submit Payment Proof →'"></button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- STANDARD MODAL -->
    <div x-show="modalOpen && !directEventMode" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" style="display: none;">
        <div @click.away="closeEventModal()" class="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl border border-slate-200 my-8 max-h-[90vh] flex flex-col">
            <template x-if="activeEvent">
                <div class="flex flex-col h-full overflow-y-auto">
                    <div class="relative h-56 w-full bg-slate-100">
                        <img :src="activeEvent.image" class="w-full h-full object-cover">
                        <button @click="closeEventModal()" class="absolute top-4 right-4 bg-white/90 text-slate-900 p-2 rounded-full shadow-md font-bold">✕</button>
                    </div>
                    <div class="p-6 sm:p-8 space-y-6">
                        <div class="space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="px-3 py-1 rounded-full text-xs font-bold bg-brand-50 text-brand-600" x-text="activeEvent.category"></span>
                                <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700" x-text="'Selected: ' + selectedTier.name"></span>
                            </div>
                            <h2 class="text-2xl font-extrabold text-slate-900 mt-2" x-text="activeEvent.title"></h2>
                            <p class="text-xs text-slate-500 mt-1" x-text="activeEvent.date + ' • ' + activeEvent.location"></p>
                        </div>

                        <!-- TICKET TIER SELECTOR IN MODAL -->
                        <div class="space-y-2">
                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-800">Select Ticket Tier:</h4>
                            <div class="grid grid-cols-2 gap-2">
                                <template x-for="tier in getEventTiers(activeEvent.id)" :key="tier.name">
                                    <div @click="selectedTier = tier"
                                         :class="selectedTier.name === tier.name ? 'border-brand-600 bg-brand-50/60 ring-2 ring-brand-600' : 'border-slate-200 bg-white'"
                                         class="p-3 rounded-xl border cursor-pointer transition-all flex flex-col justify-between space-y-1">
                                        <div class="flex items-center justify-between text-xs">
                                            <span class="font-bold text-slate-800" x-text="tier.name"></span>
                                            <span class="font-extrabold text-brand-600" x-text="tier.price"></span>
                                        </div>
                                        <span class="text-[10px] text-slate-500" x-text="'🟢 ' + tier.remaining + ' left'"></span>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- REVIEWS IN MODAL -->
                        <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                            <div class="flex items-center justify-between">
                                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-800">💬 Attendee Reviews</h4>
                                <span class="text-xs text-amber-500 font-bold">★ 4.9 / 5.0</span>
                            </div>
                            <div class="space-y-2">
                                <template x-for="review in getEventReviews(activeEvent.id)" :key="review.id">
                                    <div class="bg-white p-3 rounded-xl border border-slate-200 space-y-1 relative">
                                        <div class="flex items-center justify-between text-xs">
                                            <span class="font-bold text-slate-800" x-text="review.author"></span>
                                            <div class="flex items-center space-x-2">
                                                <span class="text-[10px] text-slate-400" x-text="review.time"></span>
                                                <template x-if="isAdmin">
                                                    <button @click="deleteAdminReview(activeEvent.id, review.id)" class="text-[10px] text-red-500 hover:text-red-700 font-bold px-1 py-0.5 rounded bg-red-50">Delete</button>
                                                </template>
                                            </div>
                                        </div>
                                        <p class="text-xs text-slate-600" x-text="review.text"></p>
                                    </div>
                                </template>
                            </div>

                            <!-- Admin Manager Box in Modal -->
                            <template x-if="isAdmin">
                                <div class="mt-4 pt-4 border-t border-slate-200 space-y-3 bg-brand-50 p-4 rounded-xl border border-brand-100">
                                    <span class="text-xs font-bold text-brand-900 block">👑 Admin Customizer: Add Tier or Review</span>
                                    
                                    <div class="space-y-2 p-3 bg-white rounded-lg border border-brand-200">
                                        <span class="text-[11px] font-bold text-slate-700 block">➕ Add New Ticket Tier</span>
                                        <div class="grid grid-cols-3 gap-2">
                                            <input type="text" x-model="newTierName" placeholder="Tier Name" class="p-1.5 text-xs border rounded">
                                            <input type="text" x-model="newTierPrice" placeholder="Price" class="p-1.5 text-xs border rounded">
                                            <input type="number" x-model.number="newTierRemaining" placeholder="Qty" class="p-1.5 text-xs border rounded">
                                        </div>
                                        <button @click="addTicketTier(activeEvent.id)" class="w-full py-1.5 bg-brand-600 text-white text-xs font-bold rounded hover:bg-brand-700">Add Tier</button>
                                    </div>

                                    <div class="space-y-2 pt-2">
                                        <input type="text" x-model="adminReviewerName" placeholder="Reviewer Name" class="w-full p-2 text-xs bg-white border border-slate-200 rounded-lg">
                                        <textarea x-model="newAdminComment" placeholder="Review comment..." class="w-full p-2 text-xs bg-white border border-slate-200 rounded-lg" rows="2"></textarea>
                                        <button @click="postAdminReview(activeEvent.id)" class="w-full py-2 bg-indigo-700 text-white text-xs font-bold rounded-lg">Publish Review</button>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- STEP 1: PAYMENT INSTRUCTIONS -->
                        <div class="p-4 bg-indigo-50/60 rounded-2xl border border-indigo-100 space-y-2">
                            <div class="flex items-center justify-between">
                                <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-900" x-text="'Step 1: Payment (' + selectedTier.name + ' - ' + selectedTier.price + ')'"></h4>
                            </div>
                            <p class="text-xs text-slate-700 font-mono bg-white p-3.5 rounded-xl border border-indigo-100 shadow-inner" x-text="activeEvent.paymentInstructions + ' (Amount: ' + selectedTier.price + ')'"></p>
                        </div>

                        <!-- STEP 2: SUBMIT PROOF -->
                        <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200 space-y-4">
                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-800">Step 2: Submit Ticket Delivery Info & Receipt</h4>
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Your Email or WhatsApp Phone Number</label>
                                    <input type="text" x-model="buyerContact" placeholder="e.g., user@email.com or +254712345678" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-600">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Upload Payment Screenshot / Receipt</label>
                                    <input type="file" @change="handleFileUpload($event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-brand-600 file:text-white cursor-pointer">
                                </div>
                            </div>
                        </div>

                        <div class="pt-2 flex items-center justify-end space-x-3">
                            <button @click="closeEventModal()" class="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
                            <button @click="submitOrder()" :disabled="submitting" class="px-6 py-2.5 rounded-xl bg-brand-600 text-white text-xs font-semibold hover:bg-brand-700 shadow-md disabled:opacity-50" x-text="submitting ? 'Submitting Proof...' : 'Submit Payment Proof →'"></button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- SCRIPT WITH TIERED PRICING ENGINE -->
    <script>
        function eventApp() {
            return {
                loading: false,
                submitting: false,
                directEventMode: false,
                isAdmin: false,
                adminReviewerName: '',
                newAdminComment: '',
                newTierName: '',
                newTierPrice: '',
                newTierRemaining: '',
                selectedTier: { name: 'Regular', price: 'Free', remaining: 50 },
                searchQuery: '',
                selectedCategory: '',
                selectedRegion: '',
                modalOpen: false,
                activeEvent: null,
                buyerContact: '',
                paymentFileBase64: null,
                paymentFileName: '',

                scriptURL: 'https://script.google.com/macros/s/AKfycbzSG5cTHh7bGHIdLQhhUm-gSRUzKr_9f895llImxqtsyLX6FKarJWu-5iG5xeEhI7Wr/exec',

                categories: ['Music & Concerts', 'Tech & AI', 'Business & Networking', 'Sports', 'Arts & Theatre', 'Festivals'],
                events: [],
                customReviews: {},
                customTiers: {},

                toggleAdminMode() {
                    const pass = prompt('Enter Admin Passcode:');
                    if (pass === 'admin123' || pass === 'klobal') {
                        this.isAdmin = true;
                        alert('Admin Mode Activated! You can now add multiple ticket tiers with custom pricing.');
                    } else if (pass !== null) {
                        alert('Incorrect passcode.');
                    }
                },

                getEventTiers(eventId) {
                    const defaultTiers = {
                        1: [
                            { name: 'Regular', price: '$20 / KES 2,500', remaining: 45 },
                            { name: 'VIP', price: '$50 / KES 6,500', remaining: 12 },
                            { name: 'VVIP Table', price: '$150 / KES 19,500', remaining: 4 }
                        ],
                        2: [
                            { name: 'Standard Pass', price: 'Free / RSVP', remaining: 80 },
                            { name: 'All-Access VIP', price: '$75 / KES 9,800', remaining: 15 }
                        ]
                    };

                    let tiers = defaultTiers[eventId] || [
                        { name: 'Regular', price: '$25 / KES 3,200', remaining: 50 },
                        { name: 'VIP', price: '$60 / KES 7,800', remaining: 10 }
                    ];

                    if (this.customTiers[eventId]) {
                        tiers = [...this.customTiers[eventId], ...tiers];
                    }
                    return tiers;
                },

                getPrimaryPriceTag(event) {
                    if (!event || !event.id) return 'From $20';
                    const tiers = this.getEventTiers(event.id);
                    return tiers.length > 0 ? 'From ' + tiers[0].price : (event.priceTag || 'Paid');
                },

                addTicketTier(eventId) {
                    if (!this.newTierName.trim() || !this.newTierPrice.trim()) {
                        alert('Please fill in both the tier name and price.');
                        return;
                    }

                    const newTier = {
                        name: this.newTierName.trim(),
                        price: this.newTierPrice.trim(),
                        remaining: parseInt(this.newTierRemaining) || 20
                    };

                    if (!this.customTiers[eventId]) {
                        this.customTiers[eventId] = [];
                    }
                    this.customTiers[eventId].push(newTier);
                    localStorage.setItem('eventsphere_tiers', JSON.stringify(this.customTiers));

                    this.newTierName = '';
                    this.newTierPrice = '';
                    this.newTierRemaining = '';
                    alert('New ticket tier added successfully!');
                },

                getEventReviews(eventId) {
                    const defaultReviews = {
                        1: [
                            { id: 101, author: 'Brian K.', time: '2 days ago', text: 'Incredible lineup of speakers. Received my M-Pesa ticket confirmation within 5 minutes!' },
                            { id: 102, author: 'Samantha W.', time: '3 days ago', text: 'Loved the hardware exhibition booths. Well organized event.' }
                        ]
                    };

                    let list = defaultReviews[eventId] || [
                        { id: 901, author: 'David M.', time: '1 day ago', text: 'Seamless booking process and great communication from the organizers.' }
                    ];

                    if (this.customReviews[eventId]) {
                        list = [...this.customReviews[eventId], ...list];
                    }
                    return list;
                },

                postAdminReview(eventId) {
                    if (!this.newAdminComment || !this.newAdminComment.trim()) {
                        alert('Please type a review message.');
                        return;
                    }

                    const attendeeNames = ['Jessica M.', 'Kevin O.', 'Hassan A.', 'Grace N.', 'Liam P.', 'Chidi K.'];
                    const chosenName = (this.adminReviewerName && this.adminReviewerName.trim()) 
                        ? this.adminReviewerName.trim() 
                        : attendeeNames[Math.floor(Math.random() * attendeeNames.length)];

                    const newReview = {
                        id: Date.now(),
                        author: chosenName,
                        time: 'Just now',
                        text: this.newAdminComment.trim()
                    };

                    if (!this.customReviews[eventId]) {
                        this.customReviews[eventId] = [];
                    }
                    this.customReviews[eventId].unshift(newReview);
                    localStorage.setItem('eventsphere_reviews', JSON.stringify(this.customReviews));

                    this.newAdminComment = '';
                    this.adminReviewerName = '';
                    alert('Custom review published successfully as ' + chosenName + '!');
                },

                deleteAdminReview(eventId, reviewId) {
                    if (confirm('Delete this review?')) {
                        if (this.customReviews[eventId]) {
                            this.customReviews[eventId] = this.customReviews[eventId].filter(r => r.id !== reviewId);
                            localStorage.setItem('eventsphere_reviews', JSON.stringify(this.customReviews));
                        }
                    }
                },

                getInventory(event) {
                    if (!event || !event.id) return { remaining: 15, total: 100 };
                    const tiers = this.getEventTiers(event.id);
                    const totalRem = tiers.reduce((acc, t) => acc + (t.remaining || 10), 0);
                    return { remaining: totalRem, total: totalRem + 50 };
                },

                get availableRegions() {
                    const regions = this.events.map(e => e.region ? e.region.trim().toLowerCase() : '').filter(Boolean);
                    return [...new Set(regions)].sort();
                },

                async init() {
                    const savedRev = localStorage.getItem('eventsphere_reviews');
                    if (savedRev) { try { this.customReviews = JSON.parse(savedRev); } catch(e) {} }

                    const savedTiers = localStorage.getItem('eventsphere_tiers');
                    if (savedTiers) { try { this.customTiers = JSON.parse(savedTiers); } catch(e) {} }

                    await this.fetchLiveEvents();
                    this.checkURLParams();
                },

                async fetchLiveEvents() {
                    this.loading = true;
                    try {
                        const response = await fetch(this.scriptURL + '?action=getEvents');
                        const data = await response.json();
                        if (data && Array.isArray(data)) {
                            this.events = data;
                        }
                    } catch (e) {
                        console.error('Error fetching live events:', e);
                    } finally {
                        this.loading = false;
                    }
                },

                checkURLParams() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const eventId = urlParams.get('event');
                    if (eventId && this.events.length > 0) {
                        const found = this.events.find(e => String(e.id) === String(eventId));
                        if (found) {
                            this.activeEvent = found;
                            this.directEventMode = true;
                            const tiers = this.getEventTiers(found.id);
                            if (tiers.length > 0) this.selectedTier = tiers[0];
                        }
                    }
                },

                copyEventLink(eventId, mouseEvent) {
                    const cleanURL = window.location.origin + window.location.pathname + '?event=' + eventId;
                    navigator.clipboard.writeText(cleanURL).then(() => {
                        const btn = mouseEvent.currentTarget;
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '<span>✅ Copied!</span>';
                        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
                    });
                },

                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.paymentFileName = file.name;
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.paymentFileBase64 = e.target.result.split(',')[1];
                        };
                        reader.readAsDataURL(file);
                    }
                },

                async submitOrder() {
                    if (!this.buyerContact) {
                        alert('Please enter your email or phone number.');
                        return;
                    }
                    if (!this.paymentFileBase64) {
                        alert('Please upload your payment receipt screenshot.');
                        return;
                    }

                    this.submitting = true;
                    try {
                        const payload = {
                            action: 'submitOrder',
                            eventId: this.activeEvent.id,
                            eventTitle: this.activeEvent.title + ' (' + this.selectedTier.name + ' - ' + this.selectedTier.price + ')',
                            buyerContact: this.buyerContact,
                            fileName: this.paymentFileName,
                            fileData: this.paymentFileBase64
                        };

                        await fetch(this.scriptURL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        alert('Order submitted successfully for ' + this.selectedTier.name + '! Confirmation sent to ' + this.buyerContact);
                        this.resetAllFilters();
                    } catch (e) {
                        alert('Submission failed. Please try again.');
                        console.error(e);
                    } finally {
                        this.submitting = false;
                    }
                },

                get filteredEvents() {
                    return this.events.filter(event => {
                        const q = this.searchQuery.toLowerCase().trim();
                        const matchesQuery = q === '' || 
                            (event.title && event.title.toLowerCase().includes(q)) ||
                            (event.location && event.location.toLowerCase().includes(q)) ||
                            (event.category && event.category.toLowerCase().includes(q)) ||
                            (event.organizer && event.organizer.toLowerCase().includes(q)) ||
                            (event.region && event.region.toLowerCase().includes(q));

                        const matchesCategory = this.selectedCategory === '' || 
                            (event.category && event.category.toLowerCase().trim() === this.selectedCategory.toLowerCase().trim());

                        const matchesRegion = this.selectedRegion === '' || 
                            (event.region && event.region.toLowerCase().trim() === this.selectedRegion.toLowerCase().trim());

                        return matchesQuery && matchesCategory && matchesRegion;
                    });
                },

                resetAllFilters() {
                    this.searchQuery = '';
                    this.selectedCategory = '';
                    this.selectedRegion = '';
                    this.directEventMode = false;
                    this.activeEvent = null;
                    window.history.replaceState({}, document.title, window.location.pathname);
                },

                openEventModal(event) {
                    this.activeEvent = event;
                    const tiers = this.getEventTiers(event.id);
                    if (tiers.length > 0) this.selectedTier = tiers[0];
                    this.buyerContact = '';
                    this.paymentFileBase64 = null;
                    this.paymentFileName = '';
                    this.modalOpen = true;
                    const newURL = window.location.pathname + '?event=' + event.id;
                    window.history.replaceState({}, document.title, newURL);
                },

                closeEventModal() {
                    this.modalOpen = false;
                    this.activeEvent = null;
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        }
    </script>
</body>
</html>
