<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventSphere — Instant Manual Ticketing & Global Discovery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between text-slate-900 antialiased" x-data="eventApp()" x-init="init()">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" @click="resetAllFilters()">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-600/30">
                    E
                </div>
                <div>
                    <span class="text-lg font-extrabold tracking-tight text-slate-900">EventSphere</span>
                    <span class="block text-[9px] uppercase font-bold tracking-widest text-brand-600">Google Connected</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <span class="hidden sm:inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                    <span x-text="loading ? 'Syncing Sheet...' : 'Live Sync Active'"></span>
                </span>
            </div>
        </div>
    </header>

    <!-- HERO & DYNAMIC GLOBAL FILTER ENGINE -->
    <section class="relative bg-gradient-to-b from-white via-slate-50 to-slate-100 py-12 px-4 sm:px-6 lg:px-8 border-b border-slate-200">
        <div class="max-w-4xl mx-auto text-center space-y-6">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight">
                Secure your tickets worldwide, <span class="text-brand-600">zero gateway fees.</span>
            </h1>
            <p class="text-sm sm:text-base text-slate-600 max-w-2xl mx-auto">
                Discover live events across any country or continent, pay directly via mobile money or bank transfer, and receive your verified ticket instantly.
            </p>

            <!-- SEARCH BAR -->
            <div class="relative max-w-2xl mx-auto shadow-2xl shadow-slate-300/60 rounded-2xl overflow-hidden bg-white border border-slate-200">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <input 
                    type="text" 
                    x-model.debounce.30ms="searchQuery" 
                    placeholder="Search events by title, country, city, topic, or organizer..." 
                    class="w-full pl-12 pr-12 py-4 text-slate-900 placeholder-slate-400 bg-transparent text-sm sm:text-base focus:outline-none"
                >
                <template x-if="searchQuery">
                    <button @click="searchQuery = ''" class="absolute inset-y-0 right-0 pr-4 flex items-center text-xs font-bold text-slate-400 hover:text-slate-600">Clear</button>
                </template>
            </div>

            <!-- DYNAMIC FILTER CONTROLS -->
            <div class="space-y-3 pt-2">
                <!-- Region Filter -->
                <div class="flex items-center justify-center flex-wrap gap-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-1">Region / Country:</span>
                    <template x-for="reg in availableRegions" :key="reg">
                        <button 
                            @click="selectedRegion = (selectedRegion === reg ? '' : reg)"
                            :class="selectedRegion === reg ? 'bg-indigo-900 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'"
                            class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-all capitalize"
                            x-text="reg"
                        ></button>
                    </template>
                </div>

                <!-- Category Filter -->
                <div class="flex items-center justify-center flex-wrap gap-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-1">Category:</span>
                    <template x-for="cat in categories" :key="cat">
                        <button 
                            @click="selectedCategory = (selectedCategory === cat ? '' : cat)"
                            :class="selectedCategory === cat ? 'bg-brand-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'"
                            class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-all"
                            x-text="cat"
                        ></button>
                    </template>
                </div>

                <!-- Active Filter Reset Bar -->
                <template x-if="searchQuery || selectedCategory || selectedRegion">
                    <div class="pt-2 flex items-center justify-center space-x-2 animate-fade-in">
                        <span class="text-xs text-slate-500 font-medium">Filters active.</span>
                        <button @click="resetAllFilters()" class="text-xs font-bold text-brand-600 hover:underline bg-brand-50 px-3 py-1 rounded-full border border-brand-100">Reset All Filters ✕</button>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- CATALOG GRID -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex items-center justify-between mb-6">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider" x-text="'Showing ' + filteredEvents.length.toLocaleString() + ' Events'"></p>
        </div>

        <!-- EMPTY STATE -->
        <template x-if="filteredEvents.length === 0">
            <div class="text-center py-16 bg-white rounded-3xl border border-slate-200 p-8 space-y-4 max-w-md mx-auto shadow-sm">
                <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mx-auto text-slate-400 text-xl font-bold">🌍</div>
                <div class="space-y-1">
                    <p class="text-base font-bold text-slate-800">No matching events found</p>
                    <p class="text-xs text-slate-500">Try adjusting your search or clearing your filters.</p>
                </div>
                <button @click="resetAllFilters()" class="px-5 py-2.5 rounded-xl bg-brand-600 text-white text-xs font-semibold hover:bg-brand-700 shadow-md">Clear Filters</button>
            </div>
        </template>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="event in filteredEvents" :key="event.id">
                <div 
                    @click="openEventModal(event)"
                    class="group bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col cursor-pointer transform hover:-translate-y-1 relative"
                >
                    <div class="relative h-48 w-full bg-slate-100 overflow-hidden">
                        <img :src="event.image" alt="Event" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-bold text-slate-900" x-text="event.category"></div>
                        <div class="absolute bottom-3 right-3 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-semibold text-white" x-text="event.priceTag"></div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between space-y-4">
                        <div class="space-y-2">
                            <div class="flex items-center justify-between text-xs font-semibold text-brand-600">
                                <span class="flex items-center space-x-1">
                                    <span x-text="event.date"></span>
                                    <span>•</span>
                                    <span class="truncate max-w-[140px]" x-text="event.location"></span>
                                </span>
                                <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider" x-text="event.region"></span>
                            </div>
                            <h3 class="text-base font-bold text-slate-900 group-hover:text-brand-600 transition line-clamp-2" x-text="event.title"></h3>
                            <p class="text-slate-500 text-xs line-clamp-2" x-text="event.description"></p>
                        </div>
                        <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-semibold">
                            <span class="text-brand-600 group-hover:underline">Instant Checkout →</span>
                            <!-- Share button to copy direct event link easily -->
                            <button @click.stop="copyEventLink(event.id, $event)" class="text-slate-400 hover:text-brand-600 text-[11px] flex items-center space-x-1 bg-slate-50 hover:bg-brand-50 px-2.5 py-1 rounded-lg border border-slate-200 transition">
                                <span>🔗 Copy Link</span>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- CHECKOUT MODAL -->
    <div x-show="modalOpen" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" style="display: none;">
        <div @click.away="closeEventModal()" class="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl border border-slate-200 my-8 max-h-[90vh] flex flex-col">
            <template x-if="activeEvent">
                <div class="flex flex-col h-full overflow-y-auto">
                    <div class="relative h-56 w-full bg-slate-100">
                        <img :src="activeEvent.image" class="w-full h-full object-cover">
                        <button @click="closeEventModal()" class="absolute top-4 right-4 bg-white/90 text-slate-900 p-2 rounded-full shadow-md font-bold">✕</button>
                    </div>
                    <div class="p-6 sm:p-8 space-y-6">
                        <div>
                            <span class="px-3 py-1 rounded-full text-xs font-bold bg-brand-50 text-brand-600" x-text="activeEvent.category"></span>
                            <h2 class="text-2xl font-extrabold text-slate-900 mt-2" x-text="activeEvent.title"></h2>
                            <p class="text-xs text-slate-500 mt-1" x-text="activeEvent.date + ' • ' + activeEvent.location"></p>
                        </div>

                        <!-- STEP 1: PAYMENT INSTRUCTIONS -->
                        <div class="p-4 bg-indigo-50/60 rounded-2xl border border-indigo-100 space-y-2">
                            <div class="flex items-center justify-between">
                                <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-900">Step 1: Send Payment</h4>
                                <span class="text-xs font-extrabold text-indigo-600 bg-white px-2.5 py-0.5 rounded-full shadow-sm" x-text="activeEvent.priceTag"></span>
                            </div>
                            <p class="text-xs text-slate-700 font-mono bg-white p-3.5 rounded-xl border border-indigo-100 shadow-inner" x-text="activeEvent.paymentInstructions"></p>
                        </div>

                        <!-- STEP 2: SUBMIT PROOF -->
                        <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200 space-y-4">
                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-800">Step 2: Submit Ticket Delivery Info & Receipt</h4>
                            <p class="text-[11px] text-slate-500 leading-relaxed">
                                Once you have completed the payment on your device, enter your contact details and upload your payment screenshot. Our team will verify and dispatch your ticket instantly!
                            </p>
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Your Email or WhatsApp Phone Number</label>
                                    <input type="text" x-model="buyerContact" placeholder="e.g., user@email.com or +254712345678" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-brand-600">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Upload Payment Screenshot / Receipt</label>
                                    <input type="file" @change="handleFileUpload($event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-brand-600 file:text-white cursor-pointer">
                                </div>
                            </div>
                        </div>

                        <div class="pt-2 flex items-center justify-end space-x-3">
                            <button @click="closeEventModal()" class="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
                            <button @click="submitOrder()" :disabled="submitting" class="px-6 py-2.5 rounded-xl bg-brand-600 text-white text-xs font-semibold hover:bg-brand-700 shadow-md disabled:opacity-50" x-text="submitting ? 'Submitting Proof...' : 'Submit Payment Proof →'"></button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- SCRIPT WITH DEEP LINKING SUPPORT -->
    <script>
        function eventApp() {
            return {
                loading: false,
                submitting: false,
                searchQuery: '',
                selectedCategory: '',
                selectedRegion: '',
                modalOpen: false,
                activeEvent: null,
                buyerContact: '',
                paymentFileBase64: null,
                paymentFileName: '',

                scriptURL: 'https://script.google.com/macros/s/AKfycbzSG5cTHh7bGHIdLQhhUm-gSRUzKr_9f895llImxqtsyLX6FKarJWu-5iG5xeEhI7Wr/exec',

                categories: ['Music & Concerts', 'Tech & AI', 'Business & Networking', 'Sports', 'Arts & Theatre', 'Festivals'],
                events: [],

                get availableRegions() {
                    const regions = this.events.map(e => e.region ? e.region.trim().toLowerCase() : '').filter(Boolean);
                    return [...new Set(regions)].sort();
                },

                async init() {
                    await this.fetchLiveEvents();
                    this.checkURLParams();
                },

                async fetchLiveEvents() {
                    this.loading = true;
                    try {
                        const response = await fetch(this.scriptURL + '?action=getEvents');
                        const data = await response.json();
                        if (data && Array.isArray(data)) {
                            this.events = data;
                        }
                    } catch (e) {
                        console.error('Error fetching live events from Google Sheet:', e);
                    } finally {
                        this.loading = false;
                    }
                },

                // Auto-open modal if URL contains ?event=ID
                checkURLParams() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const eventId = urlParams.get('event');
                    if (eventId && this.events.length > 0) {
                        const found = this.events.find(e => String(e.id) === String(eventId));
                        if (found) {
                            this.openEventModal(found);
                        }
                    }
                },

                copyEventLink(eventId, mouseEvent) {
                    const cleanURL = window.location.origin + window.location.pathname + '?event=' + eventId;
                    navigator.clipboard.writeText(cleanURL).then(() => {
                        const btn = mouseEvent.currentTarget;
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '<span>✅ Copied!</span>';
                        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
                    });
                },

                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.paymentFileName = file.name;
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.paymentFileBase64 = e.target.result.split(',')[1];
                        };
                        reader.readAsDataURL(file);
                    }
                },

                async submitOrder() {
                    if (!this.buyerContact) {
                        alert('Please enter your email or phone number.');
                        return;
                    }
                    if (!this.paymentFileBase64) {
                        alert('Please upload your payment receipt screenshot.');
                        return;
                    }

                    this.submitting = true;
                    try {
                        const payload = {
                            action: 'submitOrder',
                            eventId: this.activeEvent.id,
                            eventTitle: this.activeEvent.title,
                            buyerContact: this.buyerContact,
                            fileName: this.paymentFileName,
                            fileData: this.paymentFileBase64
                        };

                        await fetch(this.scriptURL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        alert('Payment proof submitted successfully! Your ticket will be verified and dispatched to ' + this.buyerContact + ' shortly.');
                        this.closeEventModal();
                    } catch (e) {
                        alert('Submission failed. Please try again.');
                        console.error(e);
                    } finally {
                        this.submitting = false;
                    }
                },

                get filteredEvents() {
                    return this.events.filter(event => {
                        const q = this.searchQuery.toLowerCase().trim();
                        
                        const matchesQuery = q === '' || 
                            (event.title && event.title.toLowerCase().includes(q)) ||
                            (event.location && event.location.toLowerCase().includes(q)) ||
                            (event.category && event.category.toLowerCase().includes(q)) ||
                            (event.organizer && event.organizer.toLowerCase().includes(q)) ||
                            (event.region && event.region.toLowerCase().includes(q)) ||
                            (event.description && event.description.includes(q));

                        const matchesCategory = this.selectedCategory === '' || 
                            (event.category && event.category.toLowerCase().trim() === this.selectedCategory.toLowerCase().trim());

                        const matchesRegion = this.selectedRegion === '' || 
                            (event.region && event.region.toLowerCase().trim() === this.selectedRegion.toLowerCase().trim());

                        return matchesQuery && matchesCategory && matchesRegion;
                    });
                },

                resetAllFilters() {
                    this.searchQuery = '';
                    this.selectedCategory = '';
                    this.selectedRegion = '';
                    // Clear query param from URL without reloading page
                    window.history.replaceState({}, document.title, window.location.pathname);
                },

                openEventModal(event) {
                    this.activeEvent = event;
                    this.buyerContact = '';
                    this.paymentFileBase64 = null;
                    this.paymentFileName = '';
                    this.modalOpen = true;
                    // Update URL parameter so sharing works immediately
                    const newURL = window.location.pathname + '?event=' + event.id;
                    window.history.replaceState({}, document.title, newURL);
                },

                closeEventModal() {
                    this.modalOpen = false;
                    this.activeEvent = null;
                    // Clear the event query param from URL when modal is closed
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }
        }
    </script>
</body>
</html>
