<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventSphere — Global Event Discovery & Manual Ticketing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between text-slate-900 antialiased" x-data="eventApp()" x-init="init()">

    <!-- HEADER -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" @click="resetAllFilters()">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-600/30">
                    E
                </div>
                <div>
                    <span class="text-lg font-extrabold tracking-tight text-slate-900">EventSphere</span>
                    <span class="block text-[9px] uppercase font-bold tracking-widest text-brand-600">Google Sheets Connected</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <span class="hidden sm:inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
                    <span x-text="loading ? 'Syncing Sheet...' : 'Live Sync Active'"></span>
                </span>
            </div>
        </div>
    </header>

    <!-- HERO & FILTER ENGINE -->
    <section class="relative bg-gradient-to-b from-white via-slate-50 to-slate-100 py-12 px-4 sm:px-6 lg:px-8 border-b border-slate-200">
        <div class="max-w-4xl mx-auto text-center space-y-6">
            <h1 class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight">
                Find any event worldwide, <span class="text-brand-600">in an eye-blink.</span>
            </h1>

            <!-- SEARCH BAR -->
            <div class="relative max-w-2xl mx-auto shadow-2xl shadow-slate-300/60 rounded-2xl overflow-hidden bg-white border border-slate-200">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <input 
                    type="text" 
                    x-model.debounce.30ms="searchQuery" 
                    placeholder="Search by artist, city, topic, or keyword..." 
                    class="w-full pl-12 pr-12 py-4 text-slate-900 placeholder-slate-400 bg-transparent text-sm sm:text-base focus:outline-none"
                >
            </div>

            <!-- REGION & CATEGORY PILLS -->
            <div class="space-y-3 pt-2">
                <div class="flex items-center justify-center flex-wrap gap-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-1">Region:</span>
                    <template x-for="reg in regions" :key="reg.id">
                        <button 
                            @click="selectedRegion = (selectedRegion === reg.id ? '' : reg.id)"
                            :class="selectedRegion === reg.id ? 'bg-indigo-900 text-white' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'"
                            class="px-3 py-1.5 rounded-full text-xs font-medium transition-all"
                            x-text="reg.label"
                        ></button>
                    </template>
                </div>

                <div class="flex items-center justify-center flex-wrap gap-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-1">Category:</span>
                    <template x-for="cat in categories" :key="cat">
                        <button 
                            @click="selectedCategory = (selectedCategory === cat ? '' : cat)"
                            :class="selectedCategory === cat ? 'bg-brand-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'"
                            class="px-3.5 py-1.5 rounded-full text-xs font-medium transition-all"
                            x-text="cat"
                        ></button>
                    </template>
                </div>
            </div>
        </div>
    </section>

    <!-- CATALOG GRID -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex items-center justify-between mb-6">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider" x-text="'Showing ' + filteredEvents.length.toLocaleString() + ' Events'"></p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="event in filteredEvents" :key="event.id">
                <div 
                    @click="openEventModal(event)"
                    class="group bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col cursor-pointer transform hover:-translate-y-1"
                >
                    <div class="relative h-48 w-full bg-slate-100 overflow-hidden">
                        <img :src="event.image" alt="Event" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-bold text-slate-900" x-text="event.category"></div>
                        <div class="absolute bottom-3 right-3 bg-slate-900/80 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-semibold text-white" x-text="event.priceTag"></div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between space-y-4">
                        <div class="space-y-2">
                            <div class="flex items-center text-xs font-semibold text-brand-600 space-x-2">
                                <span x-text="event.date"></span>
                                <span>•</span>
                                <span class="truncate" x-text="event.location"></span>
                            </div>
                            <h3 class="text-base font-bold text-slate-900 group-hover:text-brand-600 transition line-clamp-2" x-text="event.title"></h3>
                            <p class="text-slate-500 text-xs line-clamp-2" x-text="event.description"></p>
                        </div>
                        <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-semibold">
                            <span class="text-brand-600 group-hover:underline">View Manual Checkout →</span>
                            <span class="text-slate-400 font-normal" x-text="event.organizer"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- CHECKOUT MODAL -->
    <div x-show="modalOpen" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" style="display: none;">
        <div @click.away="closeEventModal()" class="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl border border-slate-200 my-8 max-h-[90vh] flex flex-col">
            <template x-if="activeEvent">
                <div class="flex flex-col h-full overflow-y-auto">
                    <div class="relative h-56 w-full bg-slate-100">
                        <img :src="activeEvent.image" class="w-full h-full object-cover">
                        <button @click="closeEventModal()" class="absolute top-4 right-4 bg-white/90 text-slate-900 p-2 rounded-full shadow-md font-bold">✕</button>
                    </div>
                    <div class="p-6 sm:p-8 space-y-6">
                        <div>
                            <span class="px-3 py-1 rounded-full text-xs font-bold bg-brand-50 text-brand-600" x-text="activeEvent.category"></span>
                            <h2 class="text-2xl font-extrabold text-slate-900 mt-2" x-text="activeEvent.title"></h2>
                            <p class="text-xs text-slate-500 mt-1" x-text="activeEvent.date + ' • ' + activeEvent.location"></p>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700">1. Make Manual Payment</h4>
                            <p class="text-xs text-slate-700 font-mono bg-white p-3 rounded-xl border border-slate-200" x-text="activeEvent.paymentInstructions"></p>
                        </div>
                        <div class="p-5 bg-brand-50/50 rounded-2xl border border-brand-100 space-y-4">
                            <h4 class="text-xs font-bold uppercase tracking-wider text-brand-900">2. Submit Ticket Delivery & Receipt Proof</h4>
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Your Email or Phone</label>
                                    <input type="text" x-model="buyerContact" placeholder="e.g., user@email.com or +254712345678" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs sm:text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Upload Payment Screenshot / Receipt</label>
                                    <input type="file" @change="handleFileUpload($event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-brand-600 file:text-white cursor-pointer">
                                </div>
                            </div>
                        </div>
                        <div class="pt-2 flex items-center justify-end space-x-3">
                            <button @click="closeEventModal()" class="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600">Cancel</button>
                            <button @click="submitOrder()" :disabled="submitting" class="px-6 py-2.5 rounded-xl bg-brand-600 text-white text-xs font-semibold hover:bg-brand-700 shadow-md" x-text="submitting ? 'Submitting...' : 'Submit Order & Proof'"></button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- APP SCRIPT WITH GOOGLE SHEETS & APPS SCRIPT HOOKS -->
    <!-- APP SCRIPT WITH ROBUST FALLBACK & LIVE SYNC -->
    <script>
        function eventApp() {
            return {
                loading: false,
                submitting: false,
                searchQuery: '',
                selectedCategory: '',
                selectedRegion: '',
                modalOpen: false,
                activeEvent: null,
                buyerContact: '',
                paymentFileBase64: null,
                paymentFileName: '',

                // REPLACE WITH YOUR GOOGLE APPS SCRIPT WEB APP URL WHEN READY
                scriptURL: 'https://script.google.com/macros/s/AKfycbzb0Y2LecAwzqE16i6CQCpT1o6jrlKzW7IVoI4J67nR-0IfExkFNYyHNMYas8zMRT17/exec',

                regions: [
                    { id: 'africa', label: '🌍 Africa / East Africa' },
                    { id: 'europe', label: '🇪🇺 Europe' },
                    { id: 'virtual', label: '💻 Virtual / Global' }
                ],
                categories: ['Music & Concerts', 'Tech & AI', 'Business & Networking', 'Sports', 'Arts & Theatre', 'Festivals'],

                events: [],

                async init() {
                    await this.fetchEvents();
                },

                async fetchEvents() {
                    this.loading = true;
                    try {
                        if (this.scriptURL.includes('YOUR_DEPLOYED_SCRIPT_ID')) {
                            // Use rich mock dataset as fallback until Sheet is connected
                            this.events = [
                                { 
                                    id: 1, 
                                    title: 'Nairobi Cyber Security & AI Summit 2026', 
                                    category: 'Tech & AI', 
                                    region: 'africa',
                                    date: '2026-11-15', 
                                    location: 'Nairobi, Kenya', 
                                    priceTag: 'KES 2,500', 
                                    description: 'Deep dive into zero-trust network defenses and AI security models.', 
                                    image: 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&q=80&w=800', 
                                    organizer: 'TechSec Africa', 
                                    paymentInstructions: 'Pay via M-Pesa Till Number: 543210 (TechSec Africa) Amount: KES 2,500' 
                                },
                                { 
                                    id: 2, 
                                    title: 'Afrobeats & Rhumba Night Festival', 
                                    category: 'Music & Concerts', 
                                    region: 'africa',
                                    date: '2026-10-20', 
                                    location: 'Carnivore Grounds, Nairobi', 
                                    priceTag: 'KES 1,500', 
                                    description: 'Live bands, top DJs, and food pop-ups celebrating rhythm and culture.', 
                                    image: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&q=80&w=800', 
                                    organizer: 'VibeMasters', 
                                    paymentInstructions: 'Pay via M-Pesa Send Money to 0712345678 (John Doe) Amount: KES 1,500' 
                                },
                                { 
                                    id: 3, 
                                    title: 'Global Startup Pitch & Investor Meetup', 
                                    category: 'Business & Networking', 
                                    region: 'virtual',
                                    date: '2026-10-10', 
                                    location: 'Virtual / Global', 
                                    priceTag: 'Free / RSVP', 
                                    description: 'Connect with international angel investors and venture capitalists scaling disruptive tech.', 
                                    image: 'https://images.unsplash.com/photo-1515187029135-18ee286d815b?auto=format&fit=crop&q=80&w=800', 
                                    organizer: 'StartupWorld', 
                                    paymentInstructions: 'Free event. No payment required. Submit contact info to receive webinar link.' 
                                },
                                { 
                                    id: 4, 
                                    title: 'Berlin Electronic Underground Festival', 
                                    category: 'Music & Concerts', 
                                    region: 'europe',
                                    date: '2026-11-05', 
                                    location: 'Berlin, Germany', 
                                    priceTag: '€45.00', 
                                    description: 'An immersive 12-hour showcase of avant-garde techno and visual art installations.', 
                                    image: 'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&q=80&w=800', 
                                    organizer: 'KlangKultur', 
                                    paymentInstructions: 'Pay via Bank Transfer to DE89 3704 ... (KlangKultur UG)' 
                                },
                                { 
                                    id: 5, 
                                    title: 'Lagos FinTech & Web3 Hackathon', 
                                    category: 'Tech & AI', 
                                    region: 'africa',
                                    date: '2026-10-18', 
                                    location: 'Lagos, Nigeria', 
                                    priceTag: '₦10,000', 
                                    description: 'Build decentralized financial solutions and AI payment gateways for Africa’s economy.', 
                                    image: 'https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&q=80&w=800', 
                                    organizer: 'ChainLagos', 
                                    paymentInstructions: 'Pay via Flutterwave to Account: 0123456789 (ChainLagos Ltd)' 
                                },
                                { 
                                    id: 6, 
                                    title: 'Safari Sevens Rugby Championship', 
                                    category: 'Sports', 
                                    region: 'africa',
                                    date: '2026-11-28', 
                                    location: 'RFUEA Grounds, Nairobi', 
                                    priceTag: 'KES 1,000', 
                                    description: 'Africa’s premier rugby sevens tournament featuring international teams and entertainment.', 
                                    image: 'https://images.unsplash.com/photo-1517649763962-0c6232662102?auto=format&fit=crop&q=80&w=800', 
                                    organizer: 'Kenya Rugby', 
                                    paymentInstructions: 'Pay via M-Pesa Paybill: 987654 Account: Rugby26' 
                                }
                            ];
                        } else {
                            const response = await fetch(this.scriptURL + '?action=getEvents');
                            const data = await response.json();
                            this.events = data;
                        }
                    } catch (e) {
                        console.error('Error fetching events, using fallback:', e);
                    } finally {
                        this.loading = false;
                    }
                },

                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.paymentFileName = file.name;
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.paymentFileBase64 = e.target.result.split(',')[1];
                        };
                        reader.readAsDataURL(file);
                    }
                },

                async submitOrder() {
                    if (!this.buyerContact) {
                        alert('Please enter your email or phone number.');
                        return;
                    }
                    if (!this.paymentFileBase64) {
                        alert('Please upload your payment receipt screenshot.');
                        return;
                    }

                    this.submitting = true;
                    try {
                        if (!this.scriptURL.includes('YOUR_DEPLOYED_SCRIPT_ID')) {
                            const payload = {
                                action: 'submitOrder',
                                eventId: this.activeEvent.id,
                                eventTitle: this.activeEvent.title,
                                buyerContact: this.buyerContact,
                                fileName: this.paymentFileName,
                                fileData: this.paymentFileBase64
                            };

                            await fetch(this.scriptURL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                        }

                        alert('Order and receipt submitted successfully! Your ticket will be sent to ' + this.buyerContact + ' upon verification.');
                        this.closeEventModal();
                    } catch (e) {
                        alert('Submission failed. Please try again.');
                        console.error(e);
                    } finally {
                        this.submitting = false;
                    }
                },

                get filteredEvents() {
                    return this.events.filter(event => {
                        const matchesQuery = this.searchQuery === '' || 
                            event.title.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                            event.location.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                            event.category.toLowerCase().includes(this.searchQuery.toLowerCase());

                        const matchesCategory = this.selectedCategory === '' || event.category === this.selectedCategory;
                        const matchesRegion = this.selectedRegion === '' || event.region === this.selectedRegion;

                        return matchesQuery && matchesCategory && matchesRegion;
                    });
                },

                resetAllFilters() {
                    this.searchQuery = '';
                    this.selectedCategory = '';
                    this.selectedRegion = '';
                },

                openEventModal(event) {
                    this.activeEvent = event;
                    this.buyerContact = '';
                    this.paymentFileBase64 = null;
                    this.paymentFileName = '';
                    this.modalOpen = true;
                },

                closeEventModal() {
                    this.modalOpen = false;
                    this.activeEvent = null;
                }
            }
        }
    </script>
</body>
</html>
